<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%234d8446'/%3E%3Crect x='7' y='2' width='2' height='3' fill='%233f7a2e'/%3E%3Crect x='3' y='5' width='10' height='9' fill='%23c83b32'/%3E%3Crect x='3' y='11' width='10' height='3' fill='%238e2b27'/%3E%3Crect x='5' y='7' width='3' height='2' fill='%23e5675a'/%3E%3C/svg%3E">
<title>Pasture Run — pixelasset sample</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: #14180f; color: #b9c9a8;
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  h1 { margin: 0; font-size: 14px; letter-spacing: .18em; color: #f2e9c8; text-transform: uppercase; }
  canvas { image-rendering: pixelated; display: block; border: 2px solid #2e3a24; background: #4d8446; }
  .keys { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; font-size: 11px; }
  kbd {
    background: #2a321f; border: 1px solid #45522f; border-bottom-width: 2px;
    border-radius: 3px; padding: 1px 5px; color: #f2e9c8; font: inherit;
  }
  .viewer-link { margin: 0; font-size: 11px; color: #7d8c70; }
  .viewer-link a { color: #b9c9a8; }
  #error { max-width: 46ch; text-align: center; color: #e5675a; line-height: 1.6; }
  code { color: #f2e9c8; }
</style>
</head>
<body>
  <h1>Pasture Run</h1>
  <canvas id="view" width="480" height="320"></canvas>
  <p id="loading">loading sprites…</p>
  <p id="error" hidden></p>
  <div class="keys">
    <span><kbd>WASD</kbd> / <kbd>↑↓←→</kbd> move</span>
    <span><kbd>F</kbd> call the horse</span>
    <span><kbd>L</kbd> lead / let go</span>
    <span><kbd>M</kbd> mount / dismount</span>
    <span><kbd>Shift</kbd> run / gallop</span>
    <span><kbd>Ctrl</kbd> walk</span>
    <span><kbd>Space</kbd> jump</span>
    <span><kbd>G</kbd> graze</span>
    <span><kbd>P</kbd> pet</span>
    <span><kbd>T</kbd> saddle</span>
    <span><kbd>C</kbd> coat</span>
    <span><kbd>R</kbd> restart</span>
  </div>
  <p class="viewer-link"><a href="./viewer.html">asset viewer</a> — every promoted asset, animated from its metadata</p>
  <script type="module" src="./game.js"></script>
</body>
</html>
