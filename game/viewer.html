<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%234d8446'/%3E%3Crect x='3' y='4' width='10' height='8' fill='%23b05020'/%3E%3Crect x='3' y='9' width='10' height='3' fill='%235c2610'/%3E%3C/svg%3E">
<title>Asset viewer — pixelasset</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px; background: #14180f; color: #b9c9a8;
    font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  h1 { margin: 0 0 4px; font-size: 15px; letter-spacing: .18em; color: #f2e9c8; text-transform: uppercase; }
  #summary { margin: 0 0 22px; color: #8fa383; }
  #summary.error { color: #e5675a; }
  .failures { margin: -14px 0 22px; padding-left: 18px; color: #e5675a; }
  #grid { display: flex; flex-direction: column; gap: 18px; }
  .card { border: 1px solid #2e3a24; border-radius: 6px; padding: 14px 16px; background: #1a2014; }
  .card header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .card h2 { margin: 0; font-size: 13px; color: #f2e9c8; letter-spacing: .06em; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { background: #26301c; border: 1px solid #3a4a2c; border-radius: 3px; padding: 0 6px; font-size: 11px; color: #9fb392; }
  .facing { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
  .facing-label { min-width: 46px; padding-top: 6px; color: #e0a13a; font-size: 11px; text-transform: uppercase; }
  .strip { display: flex; gap: 12px; flex-wrap: wrap; }
  .clipcell { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  canvas.frame { image-rendering: pixelated; display: block; border: 1px solid #2e3a24; }
  .caption { font-size: 10px; color: #8fa383; }
</style>
</head>
<body>
  <h1>Asset viewer</h1>
  <p id="summary">loading manifest…</p>
  <div id="grid"></div>
  <script type="module" src="./viewer.js"></script>
</body>
</html>
