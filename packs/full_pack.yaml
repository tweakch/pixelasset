      ride_saddled: Horse_socks_brown_brownsaddled_riding.png
      ride_saddled_jump: Horse_socks_brown_brownsaddled_jump.png
      lead_saddled: Horse_socks_brown_leading_brownsaddle.png
      loose: Horse_socks_brown.png
      loose_jump: Horse_socks_brown_jump.png
      loose_saddled: Horse_socks_brown_brownsaddled_smallsaddle.png
      loose_saddled_jump: Horse_socks_brown_brownsaddled_smallsaddle_jump.png
  socks_black:
    label: Socks Black
    files:
      ride: Horse_fullcolor_socks_black_barebackriding.png
      ride_jump: Horse_sock_black_barebackriding_jump.png
