      ride_saddled: Horse_socks_black_brownsaddled_riding.png
      ride_saddled_jump: Horse_socks_black_brownsaddled_jump.png
      lead_saddled: Horse_socks_black_leading_brownsaddle.png
      loose: Horse_socks_black.png
      loose_jump: Horse_socks_black_jump.png
      loose_saddled: Horse_socks_black_brownsaddled_smallsaddle.png
      loose_saddled_jump: Horse_socks_black_brownsaddled_smallsaddle_jump.png

# Markings: a region of the artwork, not a colour of it.
#
# A coat palette cannot express a marking. The same bay colour becomes a white
# patch in one place and stays brown in another — #80472c is 63% #eeeeee and 36%
# itself on paint_brown — and which one depends on where the pixel is. So a
# marking needs a mask, and the pack happens to ship exactly what is needed to
# derive one: the same geometry with and without each marking. The marking IS
# the set of pixels where those two sheets differ.
#
# Each override colour is then classified by one test: does bay's palette
# contain it? Colours it does not contain are marking ink, body-independent, and
# by derivation never a key of a body mapping — so they pass through onto any
# coat untouched. Colours it does contain are the artist re-shading the body at
# a marking edge, and they go through the body mapping like any other body
# colour. That single test is the whole of how a marking composes, and it is
# verified: rendering bay through its own palette plus the override reproduces
# the shipped marking sheet with zero mismatched pixels, on all six families —
# the three bareback ones and the three saddled ones.
#
# `against` must match the `from` of any rendered coat using the marking, and it
# must be the brown one. Derived against black, the black body palette already
# contains the marking's greys and the classification collapses — reshade jumps
# from about 1% to about 30%. config/markings/<name>.yaml records what the
# derivation found, as a tripwire; nothing in it is read to build the mask.
markings:
  socks:
    label: Socks
    descriptor: socks
  paint:
    label: Paint
    descriptor: paint

# Coats rendered by palette substitution rather than shipped by the pack.
#
# One geometry — the coat named in `from` — seen through another palette, so
# every sheet, facing and frame comes out in the new coat for free.
#
# Measured, not assumed: the pack's seven coats all share one geometry (alpha
# differs from bay by 2-56 px of 135823), and bay's thirteen colours correspond
# one-to-one to black's and white's, worst minority branch 137 px. So black and
# white ARE recolourings of bay. Paint and socks are not: the same bay colour
# becomes a white patch in one place and stays brown in another, which no
# colour-keyed map can express — they need a mask, and `coat.extract_coat`
# refuses them by name rather than picking a dominant branch.
#
# black_render and white_render are named apart from the pack's own `black` and
# `white` on purpose. They are not the same artwork — rendered through bay's
# geometry they differ from the shipped sheets on ~205 px (0.15%) — and sharing
# a key would collide on asset id, collapsing the two into one manifest entry
# that the game's coat cycle groups by. Keeping both is the point: the pack's
# own black jump sheet disagrees with its no-equipment sheet on 3457 px, so the
# rendered coat is the consistent one and the two can be compared side by side.
rendered_coats:
  fox:
    label: Fox
    from: bay
    base_palette: coat_bay
    palette: coat_fox

  black_render:
    label: Black (rendered)
    from: bay
    base_palette: coat_bay
    palette: coat_black

  white_render:
    label: White (rendered)
    from: bay
    base_palette: coat_bay
    palette: coat_white

  # Hand-authored rather than extracted — the pack ships no dun, so this one is
  # a visual judgement (§22), not a measurement. It is the worked example for
  # the thing the format actually unlocks: authoring a coat against a key space.
  dun:
    label: Dun
    from: bay
    base_palette: coat_bay
    palette: coat_dun

  # Any body palette x any marking — the combinatorial payoff, and the reason
  # `marking` is a separate optional key rather than part of the palette. An
  # entry without it is completely unchanged.
  fox_socks:
    label: Fox with socks
    from: bay
    base_palette: coat_bay
