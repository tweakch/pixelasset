name: socks
version: socks_v1
family: horse
derive_from: socks_brown
against: bay
description: >-
  White leg markings, derived rather than authored. The override is exactly the
  set of pixels where the pack's socks_brown sheet differs from its bay sheet
  while both are fully opaque; each override colour is then classified by
  whether bay's palette contains it. Colours it does not contain are marking
  ink and travel unchanged onto any body coat; colours it does are the artist
  re-shading the body at a marking edge, and they go through the body mapping
  like any other body colour.

  Rendering bay's geometry with bay's own palette and this override reproduces
  socks_brown with zero mismatched pixels wherever both sheets draw — on all
  three sheet families. That round trip is what makes applying it to another
  body trustworthy, and it is why the classifier is palette membership rather
  than hue: an achromatic test misclassifies 2964 genuine ink pixels on the
  jump sheets, where the artist tinted the marking's dark end warm.

  This file is a record and a tripwire, not an input. Nothing in it is read to
  build the mask — the mask is recomputed from the pack at ingest, because a
  committed 40000-pixel override map is the third-party marking artwork in
  another encoding, and .gitignore is explicit that only derived assets are
  committed. If the pack is ever swapped, these hashes and counts stop matching
  and tests/test_coat_marking.py says so by name instead of the artwork
  changing quietly underneath a rendered coat.

  `against` must name the coat a marked rendered_coats entry uses as `from`,
  and it must be the brown one. Derived against black, the black body palette
  already contains the marking's greys, the classification collapses and
  reshade jumps from 1.4% to 32%. That ratio is the tripwire for a mis-wired
  `against`.

  The ink ladders differ per family because the families are separate artwork.
  The jump ladder is shorter and warmer at its dark end; #223300 appears in the
  socks ladders because these sheets also darken the eye by one step, which is
  not a marking but is body-independent, so it rides along harmlessly.
