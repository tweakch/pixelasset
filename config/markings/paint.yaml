name: paint
version: paint_v1
family: horse
derive_from: paint_brown
against: bay
description: >-
  White body patches — a pinto pattern. Derived the same way as socks and from
  the same pack pairing: the pixels where paint_brown differs from bay while
  both are fully opaque, with each override colour classified by whether bay's
  palette contains it. See config/markings/socks.yaml for the full rationale;
  the two markings share their mechanism and most of their ink ladder.

  Rendering bay's geometry with bay's own palette and this override reproduces
  paint_brown with zero mismatched pixels wherever both sheets draw, on all six
  families, bareback and saddled alike. Paint covers roughly three times the area
  socks does (126319 px against 40297 on the leading sheets), and both its jump
  families need no re-shading at all.

  A record and a tripwire, not an input — the mask is recomputed at ingest.
