name: coat_bay
version: coat_bay_v2
family: horse
base: coat_bay
description: >-
  Bay is the base coat: the key space every other coat of this family is written
  against. `map` has one row per colour of the source sheet's visible palette,
  ordered by pixel count descending — the order `decompose` produces — so two
  coat files diff row for row.

  Every row here is the identity, which is what makes bay the base rather than a
  claim about bay: rendering bay's geometry through this file reproduces the
  source sheets byte for byte, and that round trip is the only reason a
  substituted palette is trustworthy at all.

  `from` is the key space and must be pairwise distinct — a repeat would silently
  collapse the map and lose a step. `to` may repeat, and does: a coat whose art
  uses fewer colours than bay names the same target twice (see coat_black). That
  asymmetry is enforced by the loader, not the schema, because JSON Schema has no
  way to say "unique by property".

  The last four rows are the eye. They are written out rather than left to
  pass-through: on socks_brown the iris colour #507a00 itself splits 92/7, so
  "the eye is invariant" was true of three sheets, not of the colour. Passthrough
  still exists, for colours outside this key space entirely — rider skin, halter,
  rope, tack — which are measurably identical across bay and black on all three
  sheet families.
source:
