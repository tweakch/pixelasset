  - {from: '#5e3420', to: '#5e3420'}   #                              21181
  - {from: '#442516', to: '#442516'}   #                              17371
  - {from: '#150a05', to: '#150a05'}   #                              10940
  - {from: '#000000', to: '#000000'}   # outline, hooves, deepest      9360
  - {from: '#2a160d', to: '#2a160d'}   #                               4442
  - {from: '#734e3d', to: '#734e3d'}   # highlight — back, croup        3028
  - {from: '#482f23', to: '#482f23'}   #                               2916
  - {from: '#ffffff', to: '#ffffff'}   # eye white                       122
  - {from: '#507a00', to: '#507a00'}   # eye iris                        120
  - {from: '#334d00', to: '#334d00'}   # eye iris, shaded                116
  - {from: '#0b0b0b', to: '#0b0b0b'}   # eye pupil                         2
