name: coat_fox
version: coat_fox_v2
family: horse
base: coat_bay
description: >-
  Fuchs / chestnut. Hand-authored, not extracted — the pack ships no fox, so
  there is no sheet to read it off. Proposed by holding each bay step's luminance
  and shifting hue to chestnut, then hand-checked against the rendered sheets.

  The defining trait is the absence of black points: a bay has a black mane, tail
  and lower legs where a fox has none, so the dark rows carry the difference.
  Recolouring only the body reads as a bay with an odd tint.

  Every row performs the same substitution coat_fox_v1 did by zipping two
  nine-step ramps. The four eye rows were pass-through then and are identity rows
  now — the same pixels, one fewer thing to remember. v2 is a format migration;
  the fox did not change colour.
