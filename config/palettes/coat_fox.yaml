name: coat_fox
version: coat_fox_v2
family: horse
base: coat_bay
description: >-
  Fuchs / chestnut. Hand-authored, not extracted — the pack ships no fox, so
  there is no sheet to read it off. Proposed by holding each bay step's luminance
  and shifting hue to chestnut, then hand-checked against the rendered sheets.

  The defining trait is the absence of black points: a bay has a black mane, tail
  and lower legs where a fox has none, so the dark rows carry the difference.
  Recolouring only the body reads as a bay with an odd tint.

  Every row performs the same substitution coat_fox_v1 did by zipping two
  nine-step ramps. The four eye rows were pass-through then and are identity rows
  now — the same pixels, one fewer thing to remember. v2 is a format migration;
  the fox did not change colour.
# A chestnut's mane is the same colour as its coat — that is what distinguishes
# it from a bay, which has black points. So MANE_LIGHT landing 4 RGB units from
# BODY_BASE is the coat being correct, not the palette being careless. The cost
# is real and worth naming: bay separates those two by 23 and uses the gap to
# make the mane's hatched strands read against the neck, and a fox loses that
# texture. coat_flaxen is the same body with the mane pushed the other way, if
# a chestnut with a visible mane is what is wanted.
accept_collapse:
  BODY_BASE/MANE_LIGHT: >-
    A chestnut is self-coloured — the absence of contrasting points is the coat.
    Costs the mane's strand texture; coat_flaxen is the contrasting alternative.
source:
