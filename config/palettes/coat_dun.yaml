  - {from: '#442516', to: '#2f2b1d'}
  - {from: '#150a05', to: '#0c0c0b'}   # points
  - {from: '#000000', to: '#000000'}   # outline, hooves — left pure black
  - {from: '#2a160d', to: '#1c1912'}
  - {from: '#734e3d', to: '#7a6b45'}   # highlight — lifted, see description
  - {from: '#482f23', to: '#393424'}
  - {from: '#ffffff', to: '#ffffff'}   # eye white
  - {from: '#507a00', to: '#507a00'}   # eye iris
  - {from: '#334d00', to: '#334d00'}   # eye iris, shaded
