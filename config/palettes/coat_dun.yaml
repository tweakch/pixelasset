name: coat_dun
version: coat_dun_v1
family: horse
base: coat_bay
description: >-
  Dun — desaturated olive-tan body with black points. Hand-authored, not
  extracted: the pack ships no dun, so there is no sheet to read it off and
  correctness here is a visual judgement (§22) rather than a measurement. This
  is the worked example for authoring a coat against a key space instead of
  extracting one.

  Method, the same one that produced the fox: hold each bay step's luminance and
  shift hue and saturation, so the shading ladder carries over and the artwork
  holds its form. Every body row is within 0.5 of bay's luminance at hue 44° and
  saturation 0.38. The three darkest rows are bay's points — mane, tail, lower
  legs — and deepest shadow; a dun has black points, so they stay near-neutral
  rather than taking the body's tint.

  One deliberate deviation, and it is the thing luminance-holding gets wrong:
  bay's highlight #734e3d sits only 3.4 luminance above its body #80472c, so the
  two are separated by hue (saturated orange-brown against desaturated
  mauve-brown) rather than by value. Desaturating both collapses that
  separation and the dorsal highlight stops reading. So #734e3d is lifted to
  luminance 107 instead of 85, widening the total range to 107 against bay's 85.
  More contrast, not less, and the luminance ordering of all thirteen rows is
  unchanged.
